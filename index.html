<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚽ Flappy Football - Sút Bóng Bay Cao!</title>
    <meta name="description" content="Game đá bóng vui nhộn - Flappy Football! Bay qua các khung thành và ghi bàn!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="start-content">
                <div class="logo-container">
                    <div class="football-icon">⚽</div>
                    <h1 class="game-title">FLAPPY<br><span>FOOTBALL</span></h1>
                    <div class="football-icon">⚽</div>
                </div>
                <div class="player-preview">
                    <img src="assets/player.jpg" alt="Player" id="preview-img">
                </div>
                <p class="instruction">Nhấn <kbd>SPACE</kbd> hoặc <kbd>CLICK</kbd> để bay</p>
                <button id="start-btn" class="btn-play">
                    <span>▶ BẮT ĐẦU</span>
                </button>
                <div class="high-score-display">
                    🏆 Kỷ lục: <span id="start-high-score">0</span>
                </div>
            </div>
        </div>

        <!-- Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Overlay -->
        <div id="hud" class="hidden">
            <div class="hud-score">
                <div class="score-label">ĐIỂM</div>
                <div id="hud-score-value" class="score-value">0</div>
            </div>
            <div class="hud-coins">
                <span>⚽</span> <span id="hud-coins-value">0</span>
            </div>
            <div class="hud-high">
                🏆 <span id="hud-high-value">0</span>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen">
            <div class="gameover-content">
                <h2 class="gameover-title">THUA CUỘC GÙIII!</h2>
                <div class="gameover-icon">😵</div>
                <div class="score-board">
                    <div class="score-row">
                        <span>SỐ LẦN FAN QUAY ĐẦU</span>
                        <span id="final-score" class="final-score">0</span>
                    </div>
                    <div class="score-row">
                        <span>SỐ QUẢ BÓNG VÀNG MESSI ĐẠT ĐƯỢC</span>
                        <span id="final-coins" class="final-coins">0</span>
                    </div>
                    <div class="divider"></div>
                    <div class="score-row highlight">
                        <span>🏆 Kỷ lục</span>
                        <span id="final-high" class="final-high">0</span>
                    </div>
                </div>
                <div id="new-record" class="new-record hidden">
                    🎉 KỶ LỤC MỚI! 🎉
                </div>
                <button id="restart-btn" class="btn-play">
                    <span>🔄 CHƠI LẠI ĐÊ</span>
                </button>
            </div>
        </div>

        <!-- Pause indicator -->
        <div id="pause-indicator" class="hidden">
            <div class="pause-text">⏸ TẠM DỪNG</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
